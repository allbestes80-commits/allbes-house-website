<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=ai-legible&utm_source=comment&utm_medium=referral&utm_id=7a5730ac-6438-4650-8cda-dcc703c6007f

<meta name="hosting-provider" content="Netlify">
<meta name="netlify-deploy" content="https://netlify.new/?utm_campaign=ai-legible&amp;utm_source=meta&amp;utm_medium=referral&amp;utm_id=7a5730ac-6438-4650-8cda-dcc703c6007f">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allbes House</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#f7f4ec; --panel:#ffffff; --sage:#5c6f4f; --sage-deep:#3f4f36;
    --lav:#8677a6; --lav-soft:#efe9f5; --ink:#2c2b26; --muted:#7c7666; --line:#e3ddca;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;max-width:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.6;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0;font-weight:600;}
  .wrap{max-width:1140px;margin:0 auto;padding:0 32px;}

  header{position:sticky;top:0;background:rgba(247,244,236,.94);backdrop-filter:blur(6px);z-index:30;border-bottom:1px solid var(--line);}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0;gap:16px;flex-wrap:wrap;}
  .brand{font-family:'Fraunces',serif;font-size:clamp(17px,5vw,22px);white-space:nowrap;}
  .brand span{color:var(--sage-deep);}
  .tabs{display:flex;gap:6px;order:3;width:100%;overflow-x:auto;padding-bottom:2px;justify-content:flex-start;}
  .tab-btn{border:1px solid transparent;background:transparent;padding:8px 14px;border-radius:999px;font-family:'Work Sans',sans-serif;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;flex:none;}
  .tab-btn.active{color:#fff;background:var(--sage-deep);}
  .nav-right{display:flex;align-items:center;gap:10px;}
  .lang-switch{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;}
  .lang-btn{border:none;background:transparent;padding:7px 11px;font-size:12px;color:var(--muted);cursor:pointer;font-family:'Work Sans',sans-serif;}
  .lang-btn.active{background:var(--sage-deep);color:#fff;}
  .cart-btn{border:1px solid var(--sage-deep);background:transparent;color:var(--sage-deep);border-radius:999px;padding:8px 14px;font-size:13px;cursor:pointer;font-family:'Work Sans',sans-serif;white-space:nowrap;}

  @media(min-width:769px){
    .tabs{order:0;width:auto;flex:1;overflow:visible;justify-content:center;}
  }

  .page{display:none;padding:54px 0 100px;}
  .page.active{display:block;}

  /* HOME */
  .home-hero{text-align:center;padding:28px 0 40px;}
  .kicker{color:var(--sage-deep);font-size:clamp(10px,3vw,13px);letter-spacing:1px;margin-bottom:14px;}
  .home-hero h1{font-size:clamp(24px,7vw,44px);line-height:1.3;color:var(--ink);}
  .home-hero p{color:var(--muted);margin-top:16px;max-width:52ch;margin-left:auto;margin-right:auto;font-size:clamp(13px,3.6vw,15px);}
  .entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:44px;}
  .entry-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:38px 32px;cursor:pointer;transition:box-shadow .15s ease;}
  .entry-card:hover{box-shadow:0 10px 26px rgba(60,60,40,.08);}
  .entry-card .tag{font-size:12px;color:var(--lav);letter-spacing:1.2px;margin-bottom:14px;font-weight:600;}
  .entry-card h3{font-size:clamp(19px,5vw,23px);margin-bottom:12px;}
  .entry-card p{color:var(--muted);font-size:14px;margin:0 0 18px;}
  .entry-card .go{font-size:13px;color:var(--sage-deep);font-weight:600;}

  .trust-row{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:56px;}
  .trust-item{background:var(--lav-soft);border-radius:14px;padding:22px 18px;text-align:center;}
  .trust-item b{display:block;font-family:'Fraunces',serif;font-size:18px;color:var(--sage-deep);margin-bottom:6px;}
  .trust-item span{font-size:12px;color:var(--muted);}

  /* GOODS */
  .section-head{margin-bottom:32px;}
  .section-head h2{font-size:clamp(21px,5.5vw,27px);}
  .section-head p{color:var(--muted);margin-top:9px;font-size:14px;}
  .cat-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;}
  .cat-chip{
    font-family:'Work Sans',sans-serif;font-size:12.5px;font-weight:600;
    padding:8px 15px;border-radius:999px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);cursor:pointer;transition:.15s ease;
  }
  .cat-chip:hover{border-color:var(--sage-deep);color:var(--sage-deep);}
  .cat-chip.active{background:var(--sage-deep);border-color:var(--sage-deep);color:#fff;}
  .goods-layout{display:grid;grid-template-columns:1fr 330px;gap:28px;align-items:start;}
  .product-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .product{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;height:100%;}
  .product .photo{
    width:100%;aspect-ratio:1/1;background:#ffffff;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
  }
  .product .photo svg{width:46%;height:46%;stroke:var(--sage-deep);}
  .product .photo img{width:100%;height:100%;object-fit:contain;}
  .product .body{padding:16px 16px 18px;display:flex;flex-direction:column;flex:1;}
  .product h4{font-size:15.5px;margin-bottom:4px;font-family:'Fraunces',serif;}
  .product .desc{font-size:12.5px;color:var(--muted);margin-bottom:11px;min-height:32px;}
  .product .price{font-family:'Fraunces',serif;font-size:18px;color:var(--sage-deep);margin-bottom:13px;}
  .product .stock{font-size:11.5px;color:var(--sage-deep);margin-bottom:10px;}
  .product .stock.out{color:#b3543f;}
  .add-btn:disabled{opacity:.4;cursor:not-allowed;}
  .add-btn:disabled:hover{background:transparent;color:var(--sage-deep);}
  .add-btn{width:100%;padding:10px;border:1px solid var(--sage-deep);background:transparent;color:var(--sage-deep);border-radius:8px;font-family:'Work Sans',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;}
  .add-btn:hover{background:var(--sage-deep);color:#fff;}
  .product-actions{display:flex;gap:8px;margin-top:auto;padding-top:8px;}
  .product-actions .add-btn{flex:1;}
  .ask-btn{
    flex:none;width:38px;height:38px;border-radius:8px;border:1px solid var(--line);
    background:#eafaf0;display:flex;align-items:center;justify-content:center;text-decoration:none;
  }
  .ask-btn svg{width:19px;height:19px;fill:#25D366;}

  .cart-panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;position:sticky;top:96px;}
  .cart-panel h3{font-size:16px;margin-bottom:14px;}
  .cart-item{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);}
  .cart-item .thumb{
    width:44px;height:44px;flex:none;border-radius:8px;background:#ffffff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
  }
  .cart-item .thumb svg{width:58%;height:58%;stroke:var(--sage-deep);}
  .cart-item .thumb img{width:100%;height:100%;object-fit:contain;border-radius:8px;}
  .cart-item .info{flex:1;font-size:13px;}
  .cart-item .info .n{display:block;}
  .cart-item .info .p{color:var(--muted);font-size:12px;}
  .remove-btn{
    flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);
    background:#fff;color:var(--muted);font-size:14px;line-height:1;cursor:pointer;
  }
  .remove-btn:hover{background:#f3e9e6;color:#b3543f;border-color:#e2c9c2;}
  .cart-empty{font-size:13px;color:var(--muted);}
  .cart-total{display:flex;justify-content:space-between;font-family:'Fraunces',serif;font-size:19px;padding-top:14px;margin-top:6px;border-top:1px solid var(--line);color:var(--sage-deep);}
  .btn-primary{width:100%;margin-top:16px;padding:13px;background:var(--sage-deep);color:#fff;border:none;border-radius:10px;font-family:'Work Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;}
  .btn-primary:hover{background:var(--sage);}
  .btn-primary:disabled{background:#c7c3b3;cursor:not-allowed;}

  .field{margin-bottom:15px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;}
  .field input,.field textarea,.field select{
    width:100%;padding:11px 13px;border:1px solid var(--line);background:#fffdf8;color:var(--ink);
    font-family:'Work Sans',sans-serif;font-size:14px;border-radius:8px;
  }
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--sage-deep);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
  .phone-field{display:flex;align-items:stretch;}
  .phone-prefix{
    display:flex;align-items:center;padding:0 12px;border:1px solid var(--line);border-right:none;
    border-radius:8px 0 0 8px;background:#f1efe7;color:var(--ink);font-size:14px;font-weight:600;
  }
  .phone-field input{border-radius:0 8px 8px 0;}
  .field-hint{font-size:11.5px;color:var(--muted);margin-top:5px;}

  .pay-options{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px;}
  .pay-opt{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;font-size:13px;cursor:pointer;color:var(--muted);font-weight:600;}
  .pay-opt.selected{border-color:var(--sage-deep);color:var(--sage-deep);background:var(--lav-soft);}
  .pay-detail{background:var(--lav-soft);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--ink);margin-bottom:16px;line-height:1.8;white-space:pre-line;}

  .confirm-box{display:none;background:var(--lav-soft);border:1px solid var(--sage-deep);border-radius:10px;padding:16px 18px;margin-top:16px;font-size:14px;color:var(--ink);}
  .confirm-box b{font-family:'Fraunces',serif;font-size:16px;color:var(--sage-deep);}

  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:36px;}
  .plan{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px 20px;cursor:pointer;position:relative;}
  .plan.selected{border-color:var(--sage-deep);box-shadow:inset 0 0 0 1px var(--sage-deep);}
  .plan-name{font-size:13px;color:var(--muted);margin-bottom:6px;}
  .plan-price{font-family:'Fraunces',serif;font-size:clamp(20px,5.5vw,25px);color:var(--sage-deep);}
  .plan ul{list-style:none;padding:0;margin:16px 0 0;font-size:13px;}
  .plan li{padding:6px 0;border-top:1px solid var(--line);}
  .plan li:first-child{border-top:none;}
  .radio{position:absolute;top:20px;right:20px;width:15px;height:15px;border:1px solid var(--muted);border-radius:50%;}
  .plan.selected .radio{border-color:var(--sage-deep);background:var(--sage-deep);}

  .form-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;max-width:640px;}

  .track-highlight{background:var(--lav-soft);border-radius:14px;padding:24px 28px;margin-bottom:32px;}
  .track-highlight h3{font-size:clamp(17px,4.5vw,19px);margin-bottom:8px;color:var(--sage-deep);}
  .track-highlight p{color:var(--muted);font-size:13.5px;margin:0;}
  .track-box{max-width:540px;}
  .track-search{display:flex;gap:10px;margin-bottom:18px;}
  .track-search input{flex:1;padding:12px 14px;border:1px solid var(--line);background:#fffdf8;color:var(--ink);font-family:'Work Sans',sans-serif;font-size:14px;border-radius:8px;}
  .track-search button{padding:0 22px;background:var(--sage-deep);color:#fff;border:none;border-radius:8px;font-family:'Work Sans',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer;}
  .track-hint{font-size:12.5px;color:var(--muted);margin-bottom:24px;}
  .timeline{border-left:2px solid var(--line);padding-left:20px;}
  .t-step{position:relative;padding-bottom:26px;}
  .t-step::before{content:'';position:absolute;left:-25px;top:2px;width:11px;height:11px;border-radius:50%;background:var(--line);}
  .t-step.done::before{background:var(--sage-deep);}
  .t-step h4{font-size:14.5px;margin-bottom:3px;font-family:'Fraunces',serif;color:var(--ink);}
  .t-step span{font-size:12.5px;color:var(--muted);}
  .track-meta{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:13px;margin-bottom:22px;line-height:1.8;}
  .track-empty{font-size:14px;color:var(--muted);}

  @media(max-width:900px){
    .entry-grid,.goods-layout,.grid3,.product-grid,.pay-options,.row2,.row3,.trust-row{grid-template-columns:1fr;}
  }

  .wa-btn{
    position:fixed;right:22px;bottom:22px;z-index:40;
    width:56px;height:56px;border-radius:50%;
    background:#25D366;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.22);text-decoration:none;
    transition:transform .15s ease;
  }
  .wa-btn:hover{transform:scale(1.06);}
  .wa-btn svg{width:30px;height:30px;fill:#fff;}
  .share-btn{
    position:fixed;right:22px;bottom:88px;z-index:40;
    width:48px;height:48px;border-radius:50%;
    background:var(--sage-deep);display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 18px rgba(0,0,0,.22);border:none;cursor:pointer;
    transition:transform .15s ease;
  }
  .share-btn:hover{transform:scale(1.06);}
  .share-btn svg{width:20px;height:20px;stroke:#fff;fill:none;}
  .wa-tooltip{
    position:fixed;right:88px;bottom:36px;z-index:40;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:8px 12px;font-size:12.5px;color:var(--ink);
    box-shadow:0 4px 12px rgba(0,0,0,.08);white-space:nowrap;
  }
  @media(max-width:600px){ .wa-tooltip{display:none;} }
  @media(max-width:480px){
    .wrap{padding:0 18px;}
  }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <div class="brand">Allbes <span>House</span></div>
    <div class="tabs">
      <button class="tab-btn active" data-page="home" data-i18n="nav.home"></button>
      <button class="tab-btn" data-page="goods" data-i18n="nav.goods"></button>
      <button class="tab-btn" data-page="track" data-i18n="nav.track"></button>
    </div>
    <div class="nav-right">
      <div class="lang-switch">
        <button class="lang-btn active" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ms">BM</button>
      </div>
      <button class="cart-btn" onclick="showPage('goods')"><span data-i18n="nav.cart"></span> (<span id="cart-count">0</span>)</button>
    </div>
  </div>
</header>

<!-- HOME -->
<section class="page active" id="home">
  <div class="wrap home-hero">
    <div class="kicker" data-i18n="home.kicker"></div>
    <h1 data-i18n="home.h1"></h1>
    <p data-i18n="home.p"></p>
  </div>
  <div class="wrap entry-grid" style="grid-template-columns:1fr;max-width:520px;margin-left:auto;margin-right:auto;">
    <div class="entry-card" onclick="showPage('goods')">
      <div class="tag" data-i18n="home.card1.tag"></div>
      <h3 data-i18n="home.card1.title"></h3>
      <p data-i18n="home.card1.desc"></p>
      <div class="go" data-i18n="home.card1.go"></div>
    </div>
  </div>
  <div class="wrap trust-row">
    <div class="trust-item"><b data-i18n="home.trust1.b"></b><span data-i18n="home.trust1.s"></span></div>
    <div class="trust-item"><b data-i18n="home.trust2.b"></b><span data-i18n="home.trust2.s"></span></div>
    <div class="trust-item"><b data-i18n="home.trust3.b"></b><span data-i18n="home.trust3.s"></span></div>
  </div>
</section>

<!-- GOODS -->
<section class="page" id="goods">
  <div class="wrap">
    <div class="section-head">
      <h2 data-i18n="goods.title"></h2>
      <p data-i18n="goods.subtitle"></p>
    </div>
    <div class="cat-filters" id="cat-filters"></div>
    <div class="goods-layout">
      <div class="product-grid" id="product-grid"></div>
      <div class="cart-panel">
        <h3 data-i18n="nav.cart"></h3>
        <div id="cart-items"></div>
        <div class="cart-total"><span data-i18n="goods.total"></span><span id="cart-total">RM 0</span></div>
        <button class="btn-primary" id="checkout-btn" disabled onclick="openCheckout()" data-i18n="goods.checkout"></button>
      </div>
    </div>

    <div id="checkout-form" style="display:none;margin-top:44px;">
      <div class="section-head"><h2 data-i18n="checkout.title"></h2></div>
      <div class="form-card">
        <div class="row2">
          <div class="field"><label data-i18n="checkout.name"></label><input id="g-name" type="text"></div>
          <div class="field"><label data-i18n="checkout.phone"></label>
            <div class="phone-field">
              <span class="phone-prefix">+6</span>
              <input id="g-phone" type="text" placeholder="0123456789">
            </div>
            <div class="field-hint" data-i18n="checkout.phoneHint"></div>
          </div>
        </div>
        <div class="field"><label data-i18n="checkout.address"></label><textarea id="g-address" rows="3" required></textarea></div>
        <div class="row3">
          <div class="field"><label data-i18n="checkout.city"></label><input id="g-city" type="text" required></div>
          <div class="field"><label data-i18n="checkout.postcode"></label><input id="g-postcode" type="text" inputmode="numeric" required></div>
          <div class="field"><label data-i18n="checkout.state"></label><input id="g-state" type="text" required></div>
        </div>

        <div class="field"><label data-i18n="checkout.payLabel"></label>
          <div class="pay-options" id="g-pay-options">
            <div class="pay-opt" data-pay="bank" data-i18n="pay.bank"></div>
            <div class="pay-opt" data-pay="tng">Touch 'n Go</div>
          </div>
          <div class="pay-detail" id="g-pay-detail" data-i18n="checkout.payHint"></div>
        </div>

        <button class="btn-primary" onclick="submitGoodsOrder()" data-i18n="checkout.confirm"></button>
        <div class="confirm-box" id="g-confirm"></div>
      </div>
    </div>
  </div>
</section>

<!-- TRACK -->
<section class="page" id="track">
  <div class="wrap">
    <div class="track-highlight">
      <h3 data-i18n="nav.track"></h3>
      <p data-i18n="track.desc"></p>
    </div>
    <div class="track-box">
      <div class="track-search">
        <input id="track-input" type="text" placeholder="AH20260901">
        <button onclick="doTrack()" data-i18n="track.search"></button>
      </div>
      <div class="track-hint" data-i18n="track.hint"></div>
      <div id="track-result"></div>
    </div>
  </div>
</section>

<button class="share-btn" id="share-btn" onclick="shareSite()" title="Share">
  <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
    <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>
  </svg>
</button>

// （最多缓存 5 分钟）。表格栏位名字需要跟下面 pick() 里写的一致。
const PRODUCTS_SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSUNh6-zmUlFM-UCEj6gBVTQkMaewV6_s0-zyxWf_c5smAhl_0nWAKSIiM7hiCxSHTQYd9SOMaYChkb/pub?gid=1452182612&single=true&output=csv';
let rawProducts = []; // 从表格读到的原始商品数据，缓存在这里，语言切换时重复利用不用重新拉取
const CATEGORY_ORDER = ['Shower','Body Lotion','Body Oil','Hair Care','Hand Cream','Gift Set','Lip Care','Others'];
let activeCategory = 'all'; // 'all' 或者 CATEGORY_ORDER 里的某一个

function pick(row, keys){
  for(const k of keys){
    const v = row[k];
    if(v && String(v).trim()) return String(v).trim();
  }
  return '';
}
function inferIcon(name){
  const n = (name||'').toLowerCase();
  if(n.includes('shower')) return 'shower';
  if(n.includes('scrub') || n.includes('paste')) return 'scrub';
  if(n.includes('lip')) return 'lipbalm';
  if(n.includes('hand')) return 'handcream';
  if(n.includes('oil') || n.includes('perfum') || n.includes('parfum')) return 'lavender';
  return 'cream';
}
function shortDesc(desc){
  if(!desc) return '';
  const firstPara = desc.split(/\n\s*\n/)[0].trim();
  return firstPara.length > 90 ? firstPara.slice(0,90).trim() + '…' : firstPara;
}

async function loadProductsFromSheet(){
  const grid = document.getElementById('product-grid');
  grid.innerHTML = `<div class="cart-empty">${lang==='zh'?'商品加载中…':(lang==='en'?'Loading products…':'Memuatkan produk…')}</div>`;
  try{
    const res = await fetch(PRODUCTS_SHEET_URL);
    const csvText = await res.text();
    const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
    rawProducts = parsed.data
      .map(row=>{
        const name = pick(row, ['Product Name','商品名','Name']);
        if(!name) return null;
        const priceRaw = pick(row, ['价格 / Price','价格','Price']);
        const stockRaw = pick(row, ['库存 / Stock','库存','Stock']);
        const size = pick(row, ['Size','规格']);
        const descRaw = pick(row, ['卖点描述 / 卖点 / Description','卖点描述','卖点','Description']);
        const imageUrl = pick(row, ['Product Image','Product Link','图片','Image']);
        const category = pick(row, ['Category','分类']) || 'Others';
        return {
          name,
          size,
          price: priceRaw ? Number(priceRaw) : null,
          stock: stockRaw === '' ? null : Number(stockRaw), // null = 表格没填，先当作"现货不限量"处理，不显示库存标签
          desc: shortDesc(descRaw) + (size ? (shortDesc(descRaw) ? ' · ' : '') + size : ''),
          icon: inferIcon(name),
          imageUrl,
          category,
        };
      })
      .filter(Boolean);
  } catch(err){
    rawProducts = [];
    console.error('读取商品表格失败：', err);
  }
  renderCatFilters();
  renderProducts();
}

function iconFallback(imgEl, iconKey){
  if(imgEl && imgEl.parentElement) imgEl.parentElement.innerHTML = icons[iconKey] || '';
}
function currentProducts(){
  if(activeCategory==='all') return rawProducts;
  return rawProducts.filter(p=>p.category===activeCategory);
}
function setCategory(cat){
  activeCategory = cat;
  renderCatFilters();
  renderProducts();
}
function renderCatFilters(){
  const bar = document.getElementById('cat-filters');
  const present = CATEGORY_ORDER.filter(cat=>rawProducts.some(p=>p.category===cat));
  const allLabel = lang==='zh'?'全部':(lang==='en'?'All':'Semua');
  const chips = [{key:'all',label:allLabel}, ...present.map(c=>({key:c,label:c}))];
  bar.innerHTML = chips.map(c=>
    `<button class="cat-chip${activeCategory===c.key?' active':''}" onclick="setCategory('${c.key}')">${c.label}</button>`
  ).join('');
}
function renderProducts(){
  const grid = document.getElementById('product-grid');
  const products = currentProducts();
  grid.innerHTML = '';
  if(products.length===0){
    grid.innerHTML = `<div class="cart-empty">${lang==='zh'?'暂时没有可显示的商品':(lang==='en'?'No products available right now':'Tiada produk buat masa ini')}</div>`;
    return;
  }
  products.forEach((p,i)=>{
    const el = document.createElement('div');
    el.className='product';
    const askText = ASK_TEXT[lang](p.name);
    const askLink = 'https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(askText);
    const noStockInfo = p.stock===null;
    const outOfStock = !noStockInfo && p.stock<=0;
    const stockLabel = noStockInfo ? '' : (outOfStock ? STOCK_TEXT[lang].out : STOCK_TEXT[lang].left(p.stock));
    const noPrice = p.price===null || isNaN(p.price);
    const priceLabel = noPrice ? (lang==='zh'?'价格详询':(lang==='en'?'Contact for price':'Hubungi untuk harga')) : ('RM ' + p.price);
    const disableAdd = outOfStock || noPrice;
    const photoInner = p.imageUrl
      ? `<img src="${p.imageUrl}" alt="${p.name}" loading="lazy" onerror="iconFallback(this,'${p.icon}')">`
      : icons[p.icon];
    el.innerHTML = `
      <div class="photo">${photoInner}</div>
      <div class="body">
        <h4>${p.name}</h4>
        <div class="desc">${p.desc}</div>
        <div class="price">${priceLabel}</div>
        ${stockLabel ? `<div class="stock ${outOfStock?'out':''}">${stockLabel}</div>` : ''}
        <div class="product-actions">
          <button class="add-btn" onclick="addToCart(${i})" ${disableAdd?'disabled':''}>+</button>
          <a class="ask-btn" href="${askLink}" target="_blank" rel="noopener" title="WhatsApp">
            <svg viewBox="0 0 32 32"><path d="M16.001 3C9.373 3 4 8.373 4 15c0 2.383.7 4.6 1.902 6.463L4 29l7.727-1.867A11.94 11.94 0 0 0 16 27c6.627 0 12-5.373 12-12S22.628 3 16.001 3zm0 21.75a9.7 9.7 0 0 1-4.95-1.354l-.355-.21-4.59 1.108 1.14-4.474-.232-.367A9.7 9.7 0 0 1 5.25 15c0-5.938 4.813-10.75 10.751-10.75S26.75 9.062 26.75 15 21.938 24.75 16.001 24.75zm5.53-7.94c-.303-.152-1.792-.884-2.07-.985-.278-.102-.48-.152-.682.152s-.782.985-.958 1.187c-.176.202-.353.227-.656.076-.303-.152-1.28-.472-2.438-1.507-.901-.804-1.51-1.797-1.687-2.1-.176-.303-.019-.467.133-.618.137-.136.303-.353.454-.53.152-.176.202-.303.303-.505.101-.202.05-.379-.025-.53-.076-.152-.682-1.646-.934-2.253-.246-.591-.497-.511-.682-.52l-.581-.01c-.202 0-.53.076-.808.379-.278.303-1.06 1.036-1.06 2.527s1.085 2.932 1.236 3.135c.152.202 2.135 3.26 5.174 4.573.723.312 1.287.499 1.727.638.726.231 1.386.198 1.908.12.582-.087 1.792-.733 2.045-1.44.253-.708.253-1.314.177-1.44-.076-.127-.278-.202-.581-.354z"/></svg>
          </a>
        </div>
      </div>`;
    grid.appendChild(el);
  });
  document.querySelectorAll('.product .add-btn').forEach((btn)=>{
    btn.textContent = lang==='zh'?'加入购物袋':(lang==='en'?'Add to Bag':'Tambah ke Beg');
  });
}

/* ---------- cart ---------- */
let cart = [];
function addToCart(i){
  const products = currentProducts();
  const p = products[i];
  if(!p || (p.stock!==null && p.stock<=0) || p.price===null || isNaN(p.price)) return;
  const existing = cart.find(c=>c.name===p.name);
  if(existing){
    if(p.stock===null || existing.qty<p.stock) existing.qty++;
  } else {
    cart.push({...p, qty:1});
  }
  renderCart();
}
function removeFromCart(i){
  cart.splice(i,1);
  renderCart();
}
function renderCart(){
  const box = document.getElementById('cart-items');
  const countEl = document.getElementById('cart-count');
  const totalEl = document.getElementById('cart-total');
  const checkoutBtn = document.getElementById('checkout-btn');
  if(cart.length===0){
    box.innerHTML = `<div class="cart-empty">${t('goods.empty')}</div>`;
    checkoutBtn.disabled = true;
  } else {
    box.innerHTML = cart.map((c,i)=>{
      return `<div class="cart-item">
        <div class="thumb">${c.imageUrl ? `<img src="${c.imageUrl}" alt="${c.name}" onerror="iconFallback(this,'${c.icon}')">` : icons[c.icon]}</div>
        <div class="info"><span class="n">${c.name} ×${c.qty}</span><span class="p">RM ${c.price*c.qty}</span></div>
        <button class="remove-btn" onclick="removeFromCart(${i})" title="${lang==='zh'?'移除':(lang==='en'?'Remove':'Buang')}">×</button>
      </div>`;
    }).join('');
    checkoutBtn.disabled = false;
  }
  const total = cart.reduce((s,c)=>s+c.price*c.qty,0);
  const count = cart.reduce((s,c)=>s+c.qty,0);
  totalEl.textContent = 'RM ' + total;
  countEl.textContent = count;
}
function openCheckout(){
  document.getElementById('checkout-form').style.display='block';
  document.getElementById('checkout-form').scrollIntoView({behavior:'smooth'});
}

/* ---------- payment option UI ---------- */
function wirePayOptions(containerId, detailId, stateSetter){
  const opts = document.querySelectorAll('#'+containerId+' .pay-opt');
  opts.forEach(o=>{
    o.addEventListener('click',()=>{
      opts.forEach(x=>x.classList.remove('selected'));
      o.classList.add('selected');
      const key = o.dataset.pay;
      const detailKey = key==='bank'?'pay.bankDetail':'pay.tngDetail';
      document.getElementById(detailId).textContent = t(detailKey);
      stateSetter(key==='bank' ? t('pay.bank') : "Touch 'n Go");
    });
  });
}
let goodsPay = null;
wirePayOptions('g-pay-options','g-pay-detail', v=>goodsPay=v);

/* ---------- orders store (in-memory demo) ---------- */
const orders = {
  'AH20260601': {isGoods:true, status:2, courier:"J&T Express", trackingNo:'JT6001234567MY', placed:'2026-06-01'},
};
function genOrderNo(prefix){
  const d = new Date();
  const ymd = d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
  return prefix + ymd + Math.floor(Math.random()*90+10);
}
function goToTrack(orderNo){
  showPage('track');
  document.getElementById('track-input').value = orderNo;
  doTrack();
}
function submitGoodsOrder(){
  if(!goodsPay){ alert(t('selectPayAlert')); return; }
  const name = document.getElementById('g-name').value || t('unfilled');
  const phoneRaw = document.getElementById('g-phone').value.trim();
  const phone = phoneRaw ? ('+6' + phoneRaw) : '';
  const addressLine = document.getElementById('g-address').value.trim();
  const city = document.getElementById('g-city').value.trim();
  const postcode = document.getElementById('g-postcode').value.trim();
  const state = document.getElementById('g-state').value.trim();
  if(!addressLine || !city || !postcode || !state){
    alert(lang==='zh' ? '请填写完整的收货地址（地址、城市、邮编、州属都不能空）' : (lang==='en' ? 'Please fill in the full address (address, city, postcode and state are all required)' : 'Sila isi alamat penuh (alamat, bandar, poskod dan negeri semuanya diperlukan)'));
    return;
  }
  const address = `${addressLine}, ${postcode} ${city}, ${state}`;
  const orderNo = genOrderNo('AH');
  orders[orderNo] = {isGoods:true, status:0, courier:null, trackingNo:null, placed:new Date().toISOString().slice(0,10)};
  const itemsText = cart.map(c=>`${c.name} x${c.qty}`).join(', ');
  const total = cart.reduce((s,c)=>s+c.price*c.qty,0);
  logOrderToSheet({
    orderNo, name, phone, address,
    items: itemsText,
    total: 'RM ' + total,
    payMethod: goodsPay
  });
  sendOrderNotify(name, phone, orderNo);
  const box = document.getElementById('g-confirm');
  box.style.display='block';
  box.innerHTML = t('submitGoods')(name, orderNo, goodsPay) + `<br><span style="cursor:pointer;text-decoration:underline;color:var(--sage-deep)" onclick="goToTrack('${orderNo}')">${t('track.viewTrack')}</span>`;
}
/* ---------- tracking ---------- */
function doTrack(){
  const no = document.getElementById('track-input').value.trim().toUpperCase();
  const result = document.getElementById('track-result');
  const order = orders[no];
  if(!order){
    result.innerHTML = `<div class="track-empty">${t('track.notFound')}</div>`;
    return;
  }
  const stages = order.isGoods ? t('track.goodsStages') : t('track.serviceStages');
  const typeLabel = order.isGoods ? t('track.goodsType') : t('track.serviceType');
  let meta = `<div class="track-meta">${t('track.type')}：${typeLabel}　${t('track.placed')}：${order.placed}`;
  if(order.courier){ meta += `<br>${t('track.courier')}：${order.courier}　${t('track.trackingNo')}：${order.trackingNo}`; }
  meta += '</div>';
  let timeline = '<div class="timeline">';
  stages.forEach((s,i)=>{
    const done = i<=order.status;
    timeline += `<div class="t-step ${done?'done':''}"><h4>${s}</h4><span>${done?t('track.done'):t('track.pending')}</span></div>`;
  });
  timeline += '</div>';
  result.innerHTML = meta + timeline;
}

applyLang();
document.getElementById('track-result').innerHTML = `<div class="track-empty">${t('track.empty')}</div>`;
updateWaButton();
loadProductsFromSheet();
</script>
